name: Windows build
on:
  push:
    branches: [main]
    tags: ['dictado-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    name: Windows checks
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Rust GNU
        shell: pwsh
        run: |
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt --component clippy
          rustup override set 1.99.0-x86_64-pc-windows-gnu
      - name: Cache pinned build tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            .tools/cmake-4.3.5-windows-x86_64
            .tools/ninja
            .tools/llvm-mingw-20260922-ucrt-x86_64
            .tools/vulkan/Bin
            .tools/vulkan/Include
            .tools/vulkan/Lib
          key: windows-gnu-tools-${{ hashFiles('Cargo.lock', 'scripts/tool-sources.json', 'scripts/bootstrap-tools.ps1') }}
      - name: Build and check the Windows installer
        shell: pwsh
        run: |
          ./scripts/build-native.ps1 -Vulkan -Gnu
          ./scripts/check.ps1
          ./scripts/build-installer.ps1
          ./scripts/smoke-installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Dictado-Lite-Windows-x64
          path: artifacts/*-Setup.exe
          if-no-files-found: error
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Dictado-Lite-Windows-x64
          path: artifacts
      - name: Create draft from the merged version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$GITHUB_REF_NAME" = "dictado-v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -f "artifacts/Dictado-Lite-$version-Setup.exe"
          gh release create "$GITHUB_REF_NAME" "artifacts/Dictado-Lite-$version-Setup.exe" --draft --verify-tag --title "Dictado Lite $version" --notes-file docs/release-notes.md
