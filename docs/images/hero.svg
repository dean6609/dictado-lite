<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Dictado Lite</title>
  <desc id="description">Speak. Press. Keep writing. Graphite artwork with the application's pill geometry, pearl light and nine microphone bars.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#202226"/><stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#D4DEF2" stop-opacity=".06"/><stop offset="1" stop-color="#D4DEF2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pillBody" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#202226"/><stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#BAB8FF" stop-opacity=".25"/>
      <stop offset=".42" stop-color="#73D4F5" stop-opacity=".07"/>
      <stop offset="1" stop-color="#8CB3F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pearl">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".45" stop-color="#E0F5FF"/>
      <stop offset="1" stop-color="#A3B8ED"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <ellipse cx="600" cy="95" rx="460" ry="260" fill="url(#ambient)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#D1D9ED" stroke-opacity=".14"/>
  <!-- Same 112 x 34 geometry and color stops as the native indicator. -->
  <g transform="translate(488 55) scale(2)">
    <rect x="-2" y="2" width="116" height="38" rx="19" fill="#000000" opacity=".16"/>
    <rect width="112" height="34" rx="17" fill="url(#pillBody)" stroke="#D1D9ED" stroke-opacity=".14" stroke-width=".7"/>
    <circle cx="25" cy="17" r="15" fill="url(#glow)"/>
    <circle cx="25" cy="17" r="3.2" fill="url(#pearl)"/>
    <g fill="#D4DEF2" opacity=".9">
      <rect x="45" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="49.5" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="54" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="58.5" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="63" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="67.5" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="72" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="76.5" y="15.7" width="2.2" height="2.6" rx="1.1"/>
      <rect x="81" y="15.7" width="2.2" height="2.6" rx="1.1"/>
    </g>
  </g>
  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="167" font-size="12" letter-spacing="3.2" fill="#AEB8CA">LOCAL DICTATION FOR WINDOWS</text>
    <text x="600" y="246" font-size="72" font-weight="600" letter-spacing="-2.5" fill="#E8EDFA">Dictado Lite</text>
    <text x="600" y="297" font-size="26" fill="#B9C0CD">Speak. Press. Keep writing.</text>
    <path d="M310 343H890" stroke="#D1D9ED" stroke-opacity=".14"/>
    <g font-size="11" letter-spacing="1.8" fill="#97A0B3">
      <text x="390" y="378">NO ACCOUNT</text>
      <text x="600" y="378">OFFLINE RECOGNITION</text>
      <text x="824" y="378">YOUR OWN SHORTCUT</text>
    </g>
  </g>
</svg>
