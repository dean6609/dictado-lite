<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Dictado Lite</title>
  <desc id="description">Speak. Press. Keep writing. Local dictation for Windows, with no account and offline recognition.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#151822"/><stop offset="1" stop-color="#090C13"/>
    </linearGradient>
    <radialGradient id="ambient">
      <stop stop-color="#6366A9" stop-opacity=".24"/><stop offset="1" stop-color="#6366A9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBody" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#252732"/><stop offset="1" stop-color="#0E0F15"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#BAC9FF" stop-opacity=".5"/><stop offset="1" stop-color="#8CB8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="440" rx="24" fill="url(#background)"/>
  <ellipse cx="600" cy="100" rx="500" ry="330" fill="url(#ambient)"/>
  <rect x=".5" y=".5" width="1199" height="439" rx="23.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  <g transform="translate(560 48) scale(1.25)">
    <rect x="1" y="1" width="62" height="62" rx="16" fill="url(#iconBody)" stroke="#383B48"/>
    <rect x="7" y="22" width="50" height="20" rx="10" fill="#11131B" stroke="#4B5060" stroke-width=".6"/>
    <circle cx="18" cy="32" r="10" fill="url(#light)"/>
    <circle cx="18" cy="32" r="3" fill="#E7F1FF"/>
    <path d="M30 29.5v5M34.5 27v10M39 24v16M43.5 26v12M48 28.5v7" fill="none" stroke="#D5DDEF" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="600" y="167" font-size="12" letter-spacing="3.2" fill="#A8B3D5">LOCAL DICTATION FOR WINDOWS</text>
    <text x="600" y="246" font-size="72" font-weight="600" letter-spacing="-2.5" fill="#F4F5FB">Dictado Lite</text>
    <text x="600" y="297" font-size="26" fill="#B9C0D2">Speak. Press. Keep writing.</text>
    <path d="M310 343H890" stroke="#A8B3D5" stroke-opacity=".15"/>
    <g font-size="11" letter-spacing="1.8" fill="#8D99B6">
      <text x="390" y="378">NO ACCOUNT</text>
      <text x="600" y="378">OFFLINE RECOGNITION</text>
      <text x="824" y="378">YOUR OWN SHORTCUT</text>
    </g>
  </g>
</svg>
