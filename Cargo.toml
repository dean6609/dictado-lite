[package]
name = "dictado-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Native Windows local dictation"

[lib]
path = "native/lib.rs"

[[bin]]
name = "dictado-lite"
path = "native/main.rs"

[dependencies]
transcribe-cpp-sys = { version = "=0.2.4", default-features = false, features = ["dynamic-backends"] }
hound = "=3.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
