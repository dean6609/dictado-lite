[package]
name = "dictado-lite"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Native Windows local dictation"

[lib]
path = "native/lib.rs"

[[bin]]
name = "dictado-lite"
path = "native/main.rs"

[dependencies]
transcribe-cpp-sys = { version = "=0.2.4", default-features = false, features = ["dynamic-backends"] }
hound = "=3.5.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
cpal = "=0.16.0"
rtrb = "=0.4.0"
rubato = "=0.16.2"
earshot = "=1.2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
  "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory",
  "Win32_System_Ole", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Registry",
  "Win32_Security", "Win32_UI_Accessibility"
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
